name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check independent packages and input safety
        run: |
          python3 tools/sync_renderer.py --check
          python3 tools/export_native_examples.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/check_package.py
          python3 tools/collect_example_outputs.py --check --output .
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install public rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv latexmk texlive-xetex texlive-latex-extra texlive-science texlive-lang-arabic texlive-lang-french fonts-lmodern fonts-noto-core fonts-noto-cjk
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Render isolated multilingual and course fixtures
        run: |
          .venv/bin/python tests/render_matrix.py --output .local/ci-matrix
          .venv/bin/python tests/native_matrix.py --output .local/ci-native --structured-matrix .local/ci-matrix
