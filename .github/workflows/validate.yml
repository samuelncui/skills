name: Validate skills
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      render: ${{ steps.changes.outputs.render }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Classify changed paths conservatively
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: python3 tools/classify_ci_changes.py --base "$BASE" --head "$HEAD" --event "$EVENT" --ref "$REF" >> "$GITHUB_OUTPUT"
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Check skill packages, declared dependency and input safety
        run: |
          .venv/bin/python tools/export_native_examples.py --check
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          .venv/bin/python -m unittest discover -s skills/testing-workflow/examples -p 'test_tags.py' -v
          .venv/bin/python tools/check_package.py
          .venv/bin/python tools/collect_example_outputs.py --check --output .
  render:
    needs: scope
    if: ${{ always() && needs.scope.outputs.render != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install public rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv latexmk texlive-xetex texlive-latex-extra texlive-science texlive-lang-arabic texlive-lang-french fonts-lmodern fonts-noto-core fonts-noto-cjk fonts-dejavu-core
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Render isolated multilingual and native study fixtures
        run: |
          .venv/bin/python tests/study_graph_components.py --output .local/ci-graph-components
          .venv/bin/python tests/structured_graph_render.py --output .local/ci-structured-graph
          .venv/bin/python tests/study_matrix.py --output .local/ci-study
          .venv/bin/python tests/render_matrix.py --output .local/ci-matrix
          .venv/bin/python tests/native_matrix.py --output .local/ci-native --structured-matrix .local/ci-matrix
          .venv/bin/python tests/configuration_matrix.py --output .local/ci-configuration
          .venv/bin/python tests/native_regressions.py --output .local/ci-regressions
      - name: Preserve synthetic matrix diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-matrix-diagnostics
          path: |
            .local/ci-*/matrix.json
            .local/ci-*/case-results/*.json
            .local/ci-matrix/flow-en-he/document.pdf
            .local/ci-native/flow-en-he/main.pdf
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
